<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrailBlock">
<meta name="theme-color" content="#0a0c0f">
<title>TrailBlock · Spartan 50K</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c0f;
    --surface: #111318;
    --surface2: #181c22;
    --border: #1e2330;
    --border2: #252c3a;
    --accent: #e8734a;
    --accent2: #f0956e;
    --accent-dim: rgba(232,115,74,0.12);
    --accent-glow: rgba(232,115,74,0.25);
    --text: #e8e4dc;
    --text2: #9099b0;
    --text3: #4a5268;
    --green: #4caf82;
    --green-dim: rgba(76,175,130,0.12);
    --blue: #5b9cf6;
    --gold: #d4a843;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100%;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 16px;
  }

  .scroll-area::-webkit-scrollbar { display: none; }

  /* HEADER */
  .header {
    padding: 16px 20px 0;
    flex-shrink: 0;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--text);
    line-height: 1;
  }

  .brand span { color: var(--accent); }

  .race-countdown { text-align: right; }

  .countdown-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--accent);
    line-height: 1;
    letter-spacing: 1px;
  }

  .countdown-label {
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }

  .race-name {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin-top: 2px;
  }

  .progress-section { padding: 10px 20px 0; flex-shrink: 0; }

  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 4px;
    height: 4px;
    overflow: visible;
    position: relative;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    transition: width 0.6s ease;
    position: relative;
  }

  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: -4px;
    top: -2px;
    width: 8px;
    height: 8px;
    background: var(--accent2);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 10px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
  }

  /* DATE NAV */
  .date-nav {
    padding: 12px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }

  .nav-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.15s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-btn:active { border-color: var(--accent); color: var(--accent); transform: scale(0.93); }

  .date-center { text-align: center; flex: 1; }

  .date-day {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    line-height: 1;
    color: var(--text);
    letter-spacing: 1px;
  }

  .date-weekday {
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }

  .date-month-year {
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
    font-weight: 300;
  }

  .week-strip-wrap { padding: 10px 20px 0; flex-shrink: 0; }

  .week-strip { display: flex; gap: 4px; }

  .week-pip {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: var(--surface2);
    transition: background 0.2s;
  }

  .week-pip.active { background: var(--accent); }
  .week-pip.done { background: var(--green); }
  .week-pip.taper { background: var(--gold); }

  /* PHASE BADGE */
  .phase-badge {
    margin: 10px 20px 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    background: var(--surface);
  }

  .phase-dot { width: 6px; height: 6px; border-radius: 50%; }

  .phase-text {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    color: var(--text2);
  }

  /* WORKOUT CARD */
  .workout-card {
    margin: 10px 20px 0;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
  }

  .workout-card-inner {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .workout-icon {
    font-size: 26px;
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: var(--surface2);
  }

  .workout-info { flex: 1; min-width: 0; }

  .workout-type {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin-bottom: 2px;
  }

  .workout-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.2;
  }

  .workout-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }

  .workout-check {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--border2);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    font-size: 13px;
    color: transparent;
    -webkit-tap-highlight-color: transparent;
  }

  .workout-check.checked {
    border-color: var(--green);
    background: var(--green-dim);
    color: var(--green);
  }

  /* NOTE */
  .note-card {
    margin: 8px 20px 0;
    padding: 11px 14px;
    border-radius: 10px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 12px;
    color: var(--text2);
    line-height: 1.65;
  }

  .note-card strong {
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }

  /* CHECKLIST */
  .checklist-section { margin: 10px 20px 0; }

  .section-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    color: var(--text3);
    margin-bottom: 7px;
    padding-left: 2px;
  }

  .check-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 13px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    margin-bottom: 3px;
    -webkit-tap-highlight-color: transparent;
  }

  .check-item:active { transform: scale(0.98); }
  .check-item.checked { background: var(--green-dim); border-color: rgba(76,175,130,0.2); }

  .check-box {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 1.5px solid var(--border2);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: transparent;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .check-item.checked .check-box {
    border-color: var(--green);
    background: var(--green);
    color: #fff;
  }

  .check-label {
    font-size: 13px;
    color: var(--text2);
    flex: 1;
    transition: color 0.15s;
  }

  .check-item.checked .check-label { color: var(--text); }
  .check-emoji { font-size: 15px; flex-shrink: 0; }

  /* METRICS */
  .metrics-section { margin: 10px 20px 0; }

  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 7px;
  }

  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .metric-label {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    color: var(--text3);
  }

  .metric-input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    width: 100%;
    outline: none;
    padding: 0;
    -webkit-appearance: none;
  }

  .metric-input::placeholder { color: var(--text3); }
  .metric-unit { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; }

  /* BOTTOM NAV */
  .bottom-nav {
    flex-shrink: 0;
    padding: 12px 20px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
  }

  .today-btn {
    padding: 9px 20px;
    border-radius: 20px;
    border: 1px solid var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
  }

  .today-btn:active { background: var(--accent); color: #fff; transform: scale(0.96); }

  .completion-ring { display: flex; align-items: center; gap: 8px; }
  .ring-text { font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }
  svg.ring circle { transition: stroke-dashoffset 0.4s ease; }

  /* REST / OUT OF PLAN */
  .rest-banner {
    margin: 14px 20px 0;
    padding: 24px 20px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    text-align: center;
  }

  .rest-emoji { font-size: 40px; margin-bottom: 10px; }
  .rest-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--text2); }
  .rest-sub { font-size: 12px; color: var(--text3); margin-top: 6px; line-height: 1.6; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeIn 0.2s ease forwards; }
</style>
</head>
<body>
<div class="app" id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.1em;">
    LOADING...
  </div>
</div>

<script>
const RACE_DATE = new Date('2026-06-20T08:15:00');
const PLAN_START = new Date('2026-04-09');
const TOTAL_WEEKS = 11;
const TOTAL_DAYS = TOTAL_WEEKS * 7;

const PHASES = [
  { weeks: [1,2], name: 'Recovery & Foundation', color: '#5b9cf6', dot: '#5b9cf6' },
  { weeks: [3,4,5,6,7], name: 'Build', color: '#e8734a', dot: '#e8734a' },
  { weeks: [8,9], name: 'Peak', color: '#d4a843', dot: '#d4a843' },
  { weeks: [10,11], name: 'Taper', color: '#4caf82', dot: '#4caf82' },
];

const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function getPhase(week) {
  return PHASES.find(p => p.weeks.includes(week)) || PHASES[0];
}

const DAY_TEMPLATES = {
  0: (week) => ({
    icon: '🧘', type: 'MOBILITY', typeColor: '#4caf82',
    name: week >= 10 ? 'Yoga + Breathwork' : 'Recovery Yoga',
    meta: week >= 10 ? '45–60 min · Peloton · Pre-race focus' : '30–45 min · Peloton · Full body flow',
    note: week >= 10
      ? 'Taper yoga — breathwork, body scan, race day visualization. You are ready.'
      : 'Day after long run. Open and release what Saturday tightened. Hips, calves, lower back priority.',
    hasPostMeditation: true,
  }),
  1: (week) => ({
    icon: '🏋️', type: 'STRENGTH A', typeColor: '#e8734a',
    name: week <= 2 ? 'Strength A · Foundation' : week >= 10 ? 'Strength A · Maintain' : 'Strength A · Squat Dominant',
    meta: week <= 2 ? '45–50 min · Light load, movement quality' : week >= 10 ? '40 min · 40% load reduction · Crunch' : '55–65 min · Crunch Fitness',
    note: week <= 2
      ? 'Marathon recovery active. Movement patterns only — leave 3 reps in the tank every set. Log to Hevy.'
      : week >= 10
      ? 'Taper — reduce load 40%, keep intensity sharp. Hack Squat → SL RDL → Lat Pulldown → Calf Raise. Log to Hevy.'
      : 'Hack Squat 4×4–5 → Bulgarian Split Squat 3×8 ea → SL DB RDL 3×8 ea → Lat Pulldown 3×8–10 → DB Incline 3×10 → Band Walk 3×15 → Eccentric Calf Raise 3×12. Log to Hevy.',
    hasPostMeditation: true,
  }),
  2: (week) => ({
    icon: '⚡', type: week <= 2 ? 'RECOVERY RIDE' : week === 3 ? 'FTP RETEST' : 'ANAEROBIC', typeColor: '#f87171',
    name: week <= 2 ? 'Easy Recovery Ride' : week === 3 ? 'FTP Retest' : 'Power Zone Max',
    meta: week <= 2 ? '30–40 min · Zone 2 · Very easy · Peloton' : week === 3 ? '60 min · 20-min all-out · Peloton' : '45–60 min · Peloton · PZ Max',
    note: week <= 2
      ? 'Still in marathon recovery. Easy spin only. Legs moving, heart rate low. No intensity whatsoever.'
      : week === 3
      ? 'FTP retest. Proper warmup, 20 min all-out effort, full cooldown. This sets your Power Zones for the entire block. Give everything you have.'
      : 'Power Zone Max on Peloton. Trust your zones. Full recovery between hard intervals. Post-ride meditation is mandatory — do not skip it.',
    hasPostMeditation: week > 2,
  }),
  3: (week) => ({
    icon: week >= 10 ? '🧘' : '🏋️',
    type: week >= 10 ? 'MOBILITY' : 'STRENGTH B + PILATES',
    typeColor: week >= 10 ? '#4caf82' : '#e8734a',
    name: week >= 10 ? 'Yoga · Recovery & Breathwork' : week <= 2 ? 'Strength B · Foundation + Pilates' : 'Strength B · Hinge & Volume + Pilates',
    meta: week >= 10 ? '45–60 min · Peloton · Second taper session' : week <= 2 ? '45 min strength · 30 min Pilates · Peloton' : '55–65 min strength + 30 min Pilates · Crunch → Peloton',
    note: week >= 10
      ? 'Second taper yoga. Breathwork and nervous system reset. You are tapering correctly — do not add workouts. Trust the process.'
      : week <= 2
      ? 'Light load only. Leg Press → Nordic band-assisted → Cable Row → DB Press. Strength first, then Pilates on Peloton. Log to Hevy.'
      : 'Leg Press 4×8–10 → Step-Ups 3×10 ea → Nordic Progression 3×5–6 → Pull-Through 3×12 → Cable Row 3×10 → DB Press 3×10 → Leg Ext/Ham Curl SS 3×12 → Soleus 3×15 → Preacher/Skull SS 3×10–12. Then Pilates. Log to Hevy.',
    hasPostMeditation: true,
  }),
  4: (week) => {
    const repeats = Math.min(3 + Math.floor((week - 3) / 1.5), 5);
    const isFartlek = week === 5 || week === 9;
    return {
      icon: '⛰️', type: isFartlek ? 'TRAIL · FARTLEK' : week <= 2 ? 'TRAIL · EASY' : 'TRAIL · HILL WORK',
      typeColor: '#d4a843',
      name: week <= 2 ? 'Easy Trail Walk/Jog' : isFartlek ? 'Trail Fartlek · Down Week' : 'Hill Repeats',
      meta: week <= 2 ? '20–30 min · Very easy · No intensity' : isFartlek ? '5–6 miles · Unstructured · Run by feel' : `~7 miles · ${repeats} repeats · 1 mi warm-up/cool-down`,
      note: week <= 2
        ? 'Walk mostly, jog if it feels good. No hills yet. Reintroduce the legs to trail footing gently.'
        : isFartlek
        ? 'Down week — no structure today. Surge when you feel like it, recover when you need to. No watch-staring. Just enjoy the trail and move freely.'
        : `Hard up, moderate through the rolling, controlled downhill with short-stride shuffle technique. ${repeats} repeats. On every descent — short stride, quick turnover, slight forward lean. Each rep is a downhill training session. 1 mile warm-up and cool-down from parking lot.`,
      hasPostMeditation: true,
    };
  },
  5: (week) => ({
    icon: '🏃', type: 'OPTIONAL', typeColor: '#9099b0',
    name: 'Easy Run · Optional',
    meta: '3–5 miles · Zone 2 · Skip without guilt',
    note: 'Only run this if you feel genuinely good and have the time. Zone 2 — conversational pace. If tired, skip it. That is the correct call, not a failure.',
    hasPostMeditation: false,
    isOptional: true,
  }),
  6: (week) => {
    const runs = {
      1: { dist: '4–6 mi', effort: 'Very easy recovery jog · No pace pressure · Just moving', intensity: 'Recovery Jog' },
      2: { dist: '6–8 mi', effort: 'Zone 2 · Easy aerobic · Purely conversational', intensity: 'Aerobic Endurance' },
      3: { dist: '10–12 mi', effort: 'Zone 2 · Pure aerobic endurance · Nose breathing target', intensity: 'Aerobic Endurance' },
      4: { dist: '13–14 mi', effort: 'Zone 2 · Steady aerobic · Consistent effort throughout', intensity: 'Aerobic Endurance' },
      5: { dist: '11–12 mi', effort: 'Zone 2 · Down week · Optional fartlek last 2 miles if legs feel good', intensity: 'Down Week' },
      6: { dist: '16–17 mi', effort: 'Zone 2 first 75% → aerobic power final 25%', intensity: 'Endurance → Power' },
      7: { dist: '18–20 mi', effort: 'Zone 2 → aerobic power last 4 miles · Practice race fueling', intensity: 'Build to Power' },
      8: { dist: '26.2 mi', effort: 'Aerobic endurance pace only — controlled, not a race · Full race nutrition protocol', intensity: 'Peak Long Run' },
      9: { dist: '14–16 mi', effort: 'Aerobic power throughout · Down week · Strong but controlled', intensity: 'Down Week · Power' },
      10: { dist: '8–10 mi', effort: 'Zone 2 · Easy · Taper is real · Resist adding miles', intensity: 'Taper' },
      11: { dist: '4–5 mi', effort: 'Very easy shakeout · Loose · Light · Race week — you are ready', intensity: 'Race Week Shakeout' },
    };
    const d = runs[week] || runs[1];
    return {
      icon: '🏃', type: 'LONG RUN', typeColor: '#c084fc',
      name: week === 8 ? 'Peak Long Run · Marathon Distance' : week >= 10 ? 'Taper Long Run' : 'Long Run',
      meta: `${d.dist} · ${d.intensity} · Gravel trail`,
      note: `${d.effort}. ${week === 8 ? 'This is your peak. You earned it. Run relaxed, fuel every 45 min, practice your race day nutrition exactly.' : week === 11 ? 'Final run before race day. Keep it very easy. Shake the legs out, nothing more.' : week >= 10 ? 'Resist every urge to add miles. Your fitness is banked. Taper is training.' : 'Every descent is skill work — short stride, quick turnover, slight forward lean. Practice the shuffle on every downhill. That hill on your trail is your best training tool.'}`,
      hasPostMeditation: true,
    };
  },
};

function getDayData(date) {
  const msPerDay = 1000 * 60 * 60 * 24;
  const startNorm = new Date(PLAN_START.getFullYear(), PLAN_START.getMonth(), PLAN_START.getDate());
  const dateNorm = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diff = Math.round((dateNorm - startNorm) / msPerDay);
  if (diff < 0 || diff >= TOTAL_DAYS) return null;
  const week = Math.min(Math.floor(diff / 7) + 1, 11);
  const dowActual = date.getDay();
  const template = DAY_TEMPLATES[dowActual](week);
  const phase = getPhase(week);
  return { week, dayOfPlan: diff + 1, template, phase, dowActual };
}

function getDaysToRace(from) {
  const msPerDay = 1000 * 60 * 60 * 24;
  const fromNorm = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  const raceNorm = new Date(RACE_DATE.getFullYear(), RACE_DATE.getMonth(), RACE_DATE.getDate());
  return Math.max(0, Math.round((raceNorm - fromNorm) / msPerDay));
}

function storageKey(date, field) {
  return `tb_${date.getFullYear()}_${date.getMonth()}_${date.getDate()}_${field}`;
}

function saveField(date, field, value) {
  try { localStorage.setItem(storageKey(date, field), JSON.stringify(value)); } catch(e) {}
}

function loadField(date, field, defaultVal) {
  try {
    const v = localStorage.getItem(storageKey(date, field));
    return v !== null ? JSON.parse(v) : defaultVal;
  } catch(e) { return defaultVal; }
}

let currentDate = new Date();

function render() {
  const app = document.getElementById('app');
  const dayData = getDayData(currentDate);
  const daysToRace = getDaysToRace(currentDate);
  const msPerDay = 1000 * 60 * 60 * 24;
  const startNorm = new Date(PLAN_START.getFullYear(), PLAN_START.getMonth(), PLAN_START.getDate());
  const curNorm = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
  const dayOfPlan = Math.round((curNorm - startNorm) / msPerDay);
  const progressPct = Math.min(100, Math.max(0, (dayOfPlan / TOTAL_DAYS) * 100));
  const isInPlan = dayData !== null;
  const isBeforePlan = dayOfPlan < 0;
  const weekNum = isInPlan ? dayData.week : (dayOfPlan >= TOTAL_DAYS ? 11 : 0);
  const phase = isInPlan ? dayData.phase : PHASES[0];
  const template = isInPlan ? dayData.template : null;

  const checkFields = ['workout','morning_mobility','heel_drops','post_meditation','supplements','night_meditation'];
  const checks = {};
  checkFields.forEach(f => { checks[f] = loadField(currentDate, f, false); });

  const hasPost = template && template.hasPostMeditation;
  const activeChecks = hasPost
    ? checkFields
    : checkFields.filter(f => f !== 'post_meditation');
  const totalChecks = activeChecks.filter(f => checks[f]).length;
  const maxChecks = activeChecks.length;
  const completionPct = Math.round((totalChecks / maxChecks) * 100);

  const metrics = {
    cal_burned: loadField(currentDate, 'cal_burned', ''),
    cal_consumed: loadField(currentDate, 'cal_consumed', ''),
    steps: loadField(currentDate, 'steps', ''),
  };

  const weekPips = Array.from({length: 11}, (_, i) => {
    const w = i + 1;
    if (w < weekNum) return 'done';
    if (w === weekNum) return 'active';
    if (w >= 10) return 'taper';
    return '';
  });

  app.innerHTML = `
    <div class="header">
      <div class="header-top">
        <div>
          <div class="brand">TRAIL<span>BLOCK</span></div>
          <div style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;letter-spacing:0.1em;margin-top:3px;">SPARTAN 50K PREP</div>
        </div>
        <div class="race-countdown">
          <div class="countdown-number">${daysToRace}</div>
          <div class="countdown-label">days to race</div>
          <div class="race-name">Jun 20 · Whitewater WI</div>
        </div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" style="width:${progressPct}%"></div>
      </div>
      <div class="progress-meta">
        <span>${isInPlan ? `Week ${weekNum} of ${TOTAL_WEEKS}` : isBeforePlan ? 'Plan starts Apr 9' : 'Plan complete'}</span>
        <span>${Math.round(progressPct)}% complete</span>
      </div>
    </div>

    <div class="date-nav">
      <button class="nav-btn" onclick="navigate(-1)">←</button>
      <div class="date-center">
        <div class="date-weekday">${WEEKDAYS[currentDate.getDay()]}</div>
        <div class="date-day">${currentDate.getDate()}</div>
        <div class="date-month-year">${MONTHS[currentDate.getMonth()]} ${currentDate.getFullYear()}</div>
      </div>
      <button class="nav-btn" onclick="navigate(1)">→</button>
    </div>

    <div class="week-strip-wrap">
      <div class="week-strip">
        ${weekPips.map((p,i) => `<div class="week-pip ${p}" title="Week ${i+1}"></div>`).join('')}
      </div>
    </div>

    <div class="scroll-area">
      ${isInPlan && template ? `
        <div class="phase-badge animate-in" style="border-color:${phase.color}22;">
          <div class="phase-dot" style="background:${phase.dot};box-shadow:0 0 6px ${phase.dot}66;"></div>
          <div class="phase-text" style="color:${phase.color};">Phase ${PHASES.indexOf(phase)+1} · ${phase.name} · Week ${weekNum}</div>
        </div>

        <div class="workout-card animate-in" style="border-color:${template.typeColor}22;">
          <div style="background:linear-gradient(90deg,${template.typeColor}22,transparent);height:2px;"></div>
          <div class="workout-card-inner">
            <div class="workout-icon">${template.icon}</div>
            <div class="workout-info">
              <div class="workout-type" style="color:${template.typeColor};">${template.type}${template.isOptional ? ' · OPTIONAL' : ''}</div>
              <div class="workout-name">${template.name}</div>
              <div class="workout-meta">${template.meta}</div>
            </div>
            <div class="workout-check ${checks.workout ? 'checked' : ''}" onclick="toggleCheck('workout')">${checks.workout ? '✓' : ''}</div>
          </div>
        </div>

        <div class="note-card animate-in">
          <strong>Coach Note</strong>
          ${template.note}
        </div>

        <div class="checklist-section animate-in">
          <div class="section-label">Daily Checklist</div>

          <div class="check-item ${checks.morning_mobility ? 'checked' : ''}" onclick="toggleCheck('morning_mobility')">
            <div class="check-box">${checks.morning_mobility ? '✓' : ''}</div>
            <span class="check-emoji">🌅</span>
            <span class="check-label">Morning mobility routine · 15 min</span>
          </div>

          <div class="check-item ${checks.heel_drops ? 'checked' : ''}" onclick="toggleCheck('heel_drops')">
            <div class="check-box">${checks.heel_drops ? '✓' : ''}</div>
            <span class="check-emoji">🦶</span>
            <span class="check-label">Eccentric heel drops · 5 min</span>
          </div>

          ${hasPost ? `
          <div class="check-item ${checks.post_meditation ? 'checked' : ''}" onclick="toggleCheck('post_meditation')">
            <div class="check-box">${checks.post_meditation ? '✓' : ''}</div>
            <span class="check-emoji">🧠</span>
            <span class="check-label">Post-workout meditation · 5–10 min</span>
          </div>` : ''}

          <div class="check-item ${checks.supplements ? 'checked' : ''}" onclick="toggleCheck('supplements')">
            <div class="check-box">${checks.supplements ? '✓' : ''}</div>
            <span class="check-emoji">💊</span>
            <span class="check-label">Supplements taken</span>
          </div>

          <div class="check-item ${checks.night_meditation ? 'checked' : ''}" onclick="toggleCheck('night_meditation')">
            <div class="check-box">${checks.night_meditation ? '✓' : ''}</div>
            <span class="check-emoji">🌙</span>
            <span class="check-label">Sleep meditation · 15 min · Peloton</span>
          </div>
        </div>

        <div class="metrics-section animate-in" style="margin-bottom:8px;">
          <div class="section-label">Daily Metrics</div>
          <div class="metrics-grid">
            <div class="metric-card">
              <div class="metric-label">Cal Burned</div>
              <input class="metric-input" type="number" inputmode="numeric" placeholder="0" value="${metrics.cal_burned}" oninput="saveMetric('cal_burned',this.value)" style="color:var(--accent);">
              <div class="metric-unit">kcal</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Cal In</div>
              <input class="metric-input" type="number" inputmode="numeric" placeholder="0" value="${metrics.cal_consumed}" oninput="saveMetric('cal_consumed',this.value)" style="color:var(--blue);">
              <div class="metric-unit">kcal</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Steps</div>
              <input class="metric-input" type="number" inputmode="numeric" placeholder="0" value="${metrics.steps}" oninput="saveMetric('steps',this.value)" style="color:var(--green);">
              <div class="metric-unit">steps</div>
            </div>
          </div>
        </div>
      ` : `
        <div class="rest-banner animate-in">
          <div class="rest-emoji">${isBeforePlan ? '⏳' : '🏅'}</div>
          <div class="rest-title">${isBeforePlan ? 'Plan Starts Apr 9' : 'Race Complete'}</div>
          <div class="rest-sub">${isBeforePlan ? 'Rest up.\nThe work begins soon.' : 'Spartan Trail 50K\nWhitewater WI · June 20, 2026'}</div>
        </div>
      `}
    </div>

    <div class="bottom-nav">
      <button class="today-btn" onclick="goToday()">Today</button>
      <div class="completion-ring">
        <span class="ring-text">${totalChecks}/${maxChecks}</span>
        <svg width="34" height="34" viewBox="0 0 34 34" class="ring">
          <circle cx="17" cy="17" r="14" fill="none" stroke="var(--border2)" stroke-width="2.5"/>
          <circle cx="17" cy="17" r="14" fill="none"
            stroke="${completionPct === 100 ? 'var(--green)' : 'var(--accent)'}"
            stroke-width="2.5" stroke-linecap="round"
            stroke-dasharray="${2 * Math.PI * 14}"
            stroke-dashoffset="${2 * Math.PI * 14 * (1 - completionPct / 100)}"
            transform="rotate(-90 17 17)"/>
        </svg>
      </div>
    </div>
  `;
}

function navigate(dir) {
  const msPerDay = 1000 * 60 * 60 * 24;
  currentDate = new Date(currentDate.getTime() + dir * msPerDay);
  render();
}

function goToday() {
  currentDate = new Date();
  render();
}

function toggleCheck(field) {
  const cur = loadField(currentDate, field, false);
  saveField(currentDate, field, !cur);
  render();
}

function saveMetric(field, value) {
  saveField(currentDate, field, value);
}

render();
</script>
</body>
</html>
